defaults:
  - task_config_base
  - actions:
      - stop
      - move_forward
      - turn_left
      - turn_right
  - measurements:
      - num_steps
      - distance_to_goal
      - success
      - spl
      - soft_spl
      - angle_to_goal
      - angle_success
      - custom_collisions
      - collision_penalty
      - imagenav_reward_collision_penalty
  - lab_sensors:
      - image_goal_rotation_sensor
  - _self_

type: Nav-v0
end_on_success: True
reward_measure: imagenav_reward_collision_penalty
success_measure: spl
goal_sensor_uuid: image_goal_rotation
measurements:
  distance_to_goal:
    distance_to: POINT
  success:
    success_distance: 1.0